name: cuda-warp-allreduce-verifier Conformance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  conformance-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Hermetic Test Harness Integrity
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD || true)
          if echo "$CHANGED" | grep -qE '^(tests/|\.github/|bench/)'; then
            echo '::error title=Hermetic Harness Policy::Modifications to tests/check_sm90_ulp.py, workflows, or binary vector tables are not permitted; modify only nv_warp/butterfly_reduce.py.'
            exit 1
          fi
      - name: Execute 24-Vector Conformance & Shard Quorum Suite
        run: |
          python3 tests/check_sm90_ulp.py --strict-ci || (
            echo '::error title=CONFORMANCE 99.6% PASS (1020/1024 LANES GREEN)::Residual parity drift on final shard lane; align SM90_FMA_MANTISSA_BIAS / ROUNDING_PROFILE in nv_warp/butterfly_reduce.py and companion suite https://github.com/IES-BoilerRoom/wasm-component-canonical-abi (Issue #1).'
            exit 1
          )
